name: digischool_desktop
description: Flutter desktop shell for the DigiShule / EduOne portal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_windows: ^0.4.0
  window_manager: ^0.5.1
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
